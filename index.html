  <div class="page">
    <main id="main" tabindex="-1"><p class="loading">Cargando…</p></main>
    <footer class="site-footer">
      <p>© <span data-field="year"></span> Lola Satu</p>
    </footer>
  </div>

  <dialog class="lightbox" aria-label="Fotos">
    <div class="lightbox-track"></div>
    <p class="lightbox-count" aria-live="polite"></p>
    <button class="lightbox-btn lightbox-close" type="button" aria-label="Cerrar">✕</button>
    <button class="lightbox-btn lightbox-prev" type="button" aria-label="Foto anterior">←</button>
    <button class="lightbox-btn lightbox-next" type="button" aria-label="Foto siguiente">→</button>
  </dialog>

  <dialog class="viewer" aria-label="Videos">
    <div class="viewer-feed"></div>
    <button class="viewer-btn viewer-sound" type="button" aria-label="Activar sonido" aria-pressed="false">
      <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6m0-6l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="viewer-btn viewer-close" type="button" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="viewer-btn viewer-prev" type="button" aria-label="Video anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="viewer-btn viewer-next" type="button" aria-label="Video siguiente">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </dialog>

  <template id="tpl-video-tile">
    <button class="video-tile" type="button">
      <img alt="" decoding="async">
      <svg class="tile-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
      <span class="tile-caption"></span>
    </button>
  </template>

  <template id="tpl-viewer-slide">
    <section class="viewer-slide">
      <div class="viewer-frame">
        <video class="viewer-video" playsinline loop muted preload="none"></video>
        <svg class="viewer-paused" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
        <div class="viewer-caption"><a class="viewer-title"></a><span class="viewer-count"></span></div>
        <div class="viewer-progress"><span></span></div>
      </div>
    </section>
  </template>

  <template id="tpl-home">
    <section class="home">
      <h1 class="visually-hidden">Lola Satu — trabajos</h1>
      <ul class="grid"></ul>
    </section>
  </template>

  <template id="tpl-section">
    <section class="section-page">
      <p class="kicker" data-field="section-kicker"></p>
      <h1 class="page-title"></h1>
      <ul class="grid"></ul>
      <p class="empty" hidden>Todavía no hay proyectos en esta categoría.</p>
    </section>
  </template>

  <template id="tpl-card">
    <li class="card">
      <a class="card-link">
        <div class="card-media">
          <img loading="lazy" decoding="async" alt="">
          <div class="card-overlay" aria-hidden="true"><span class="card-overlay-title"></span></div>
        </div>
        <h2 class="card-title"></h2>
        <p class="card-meta"></p>
      </a>
    </li>
  </template>

  <template id="tpl-project">
    <article class="project">
      <a class="back" href="#/">← Volver</a>
      <header class="project-head">
        <h1 class="project-title"></h1>
        <p class="project-desc"></p>
      </header>
      <div class="project-body"></div>
      <nav class="more" aria-label="Más trabajos">
        <h2 class="section-label">Más trabajos</h2>
        <ul class="grid grid--more"></ul>
      </nav>
    </article>
  </template>

  <template id="tpl-reels">
    <section class="reels-page">
      <h1 class="page-title">Reels</h1>
      <p class="kicker" data-field="reels-count"></p>
      <div class="reel-grid"></div>
    </section>
  </template>

  <template id="tpl-about">
    <section class="about">
      <img class="about-photo" alt="Lola Satu" width="276" height="276">
      <div class="about-text">
        <h1 class="page-title">Sobre mí</h1>
        <div class="about-bio"></div>
        <div class="about-producer" data-field="producer">
          <h2 class="section-label">Productora</h2>
          <p><span data-field="producer-intro"></span> <a class="producer-name" data-field="producer-name" target="_blank" rel="noopener"></a><span class="producer-links"></span></p>
        </div>
        <h2 class="section-label">Qué hago</h2>
        <ul class="tag-list" data-field="services"></ul>
        <h2 class="section-label">Herramientas</h2>
        <ul class="tag-list" data-field="tools"></ul>
        <a class="cta" href="#/contacto">Escribime →</a>
      </div>
    </section>
  </template>

  <template id="tpl-contact">
    <section class="contact">
      <h1 class="visually-hidden">Contacto</h1>
      <ul class="contact-list">
        <li><a data-field="instagram" target="_blank" rel="noopener"><span>Instagram</span><span data-field="instagram-handle"></span></a></li>
        <li><a data-field="behance" target="_blank" rel="noopener"><span>Behance</span><span data-field="behance-handle"></span></a></li>
        <li><a data-field="youtube" target="_blank" rel="noopener"><span>YouTube</span><span data-field="youtube-handle"></span></a></li>
        <li><a data-field="tiktok" target="_blank" rel="noopener"><span>TikTok</span><span data-field="tiktok-handle"></span></a></li>
        <li><a data-field="email"><span>Email</span><span data-field="email-label"></span></a></li>
      </ul>
    </section>
  </template>
</body>
</html>
